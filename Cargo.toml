# This file was generated by tapir. Do not edit this file manually.
[package]
name = "integro_sdk"
version = "0.1.0"
edition = "2021"

# No `src/` — the crate root and its modules sit next to this manifest, to
# match the TypeScript/Go package layouts.
[lib]
path = "lib.rs"

[features]
# The reflection cascade: decorates the mirror types with `tapir::Reflect`
# so a consumer of this crate can re-collect them and regenerate bindings
# for its own clients. Costs nothing while off.
tapir = ["dep:tapir"]
default = ["rustls-tls"]
rustls-tls = ["reqwest/rustls-tls", "tokio-tungstenite/rustls-tls-webpki-roots"]
rustls-tls-native-roots = ["reqwest/rustls-tls-native-roots", "tokio-tungstenite/rustls-tls-native-roots"]
native-tls = ["reqwest/native-tls", "tokio-tungstenite/native-tls"]

[dependencies]
serde = { version = "1", features = ["derive"] }
regex = "1"
serde_json = "1"
serde_qs = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "charset", "http2", "system-proxy"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }
futures-util = "0.3"
tapir = { git = "https://github.com/pedrobartolini/platform-rs.git", branch = "dev", optional = true }

# Standalone: its own workspace root, so it builds in place wherever it lands.
[workspace]
